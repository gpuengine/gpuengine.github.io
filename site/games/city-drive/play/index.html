<main id="main" class="game-stage" aria-label="City Drive game">

  <canvas id="gpu-canvas"></canvas>

  <div id="hud-layer"></div>

  <div id="shell-toolbar" class="shell-toolbar">
    <button id="btn-performance" class="scenery-ctrl" title="Toggle Cool mode: 30 fps and lighter rendering to keep the laptop cool (K)">
      <span id="performance-label" class="scenery-ctrl-text">Cool:OFF</span>
      <div class="scenery-ctrl-line"></div>
    </button>
    <button id="btn-audio" class="scenery-ctrl active-sky" title="Toggle Sound (M)">
      <span id="audio-label" class="scenery-ctrl-text">Sound:ON</span>
      <div class="scenery-ctrl-line"></div>
    </button>
    <button id="btn-reload" class="scenery-ctrl" data-hard-reload title="Reload the game, fetching fresh files">
      <span class="scenery-ctrl-text">Reload</span>
      <div class="scenery-ctrl-line"></div>
    </button>
    <button id="btn-immersive" class="scenery-ctrl active-amber" title="Hide HUD for Fullscreen Immersive View (H)">
      <span class="scenery-ctrl-text">Immersive [H]</span>
      <div class="scenery-ctrl-line"></div>
    </button>
  </div>

  <div id="immersive-hint">
    <button id="btn-restore-ui" class="scenery-ctrl active-sky">
      <span class="scenery-ctrl-text scenery-ctrl-text--regular">IMMERSIVE &bull; PRESS [H] OR CLICK TO SHOW HUD</span>
      <div class="scenery-ctrl-line"></div>
    </button>
  </div>

  <div id="rec-badge">
    <span class="rec-dot"></span>
    <span class="mono rec-label">REC</span>
    <span id="rec-time" class="mono rec-time">00:00</span>
    <span class="mono rec-stop-hint">[N] STOP</span>
  </div>

  <div id="rec-dialog">
    <div class="rec-dialog-card">
      <span class="save-only mono rec-dialog-title">SAVE GAMEPLAY RECORDING?</span>
      <span id="rec-info" class="mono rec-dialog-info"></span>
      <span id="rec-status" class="mono rec-dialog-status"></span>
      <div class="rec-dialog-actions">
        <button id="rec-save" class="save-only scenery-ctrl active-amber"><span class="scenery-ctrl-text scenery-ctrl-text--regular">Save to disk…</span><div class="scenery-ctrl-line"></div></button>
        <button id="rec-discard" class="save-only scenery-ctrl"><span class="scenery-ctrl-text scenery-ctrl-text--regular">Discard</span><div class="scenery-ctrl-line"></div></button>
        <button id="rec-ok" class="notice-only scenery-ctrl"><span class="scenery-ctrl-text scenery-ctrl-text--regular">OK</span><div class="scenery-ctrl-line"></div></button>
      </div>
    </div>
  </div>

  <div id="startup-failure">
    <span class="mono startup-failure-title">CAN'T OPEN CITY DRIVE</span>
    <span id="startup-failure-reason" class="mono startup-failure-reason"></span>
    <button class="scenery-ctrl active-amber startup-failure-reload" data-hard-reload>
      <span class="scenery-ctrl-text scenery-ctrl-text--regular">Reload</span>
      <div class="scenery-ctrl-line"></div>
    </button>
  </div>

  <button class="game-fullscreen-button" type="button" aria-label="Enter full screen" title="Full screen (F)">
    <svg class="icon-enter-fullscreen" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
    <svg class="icon-exit-fullscreen" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
  </button>
</main>
