<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lesson" content="/site/tutorials/vertex-buffers/">
<title>WebGPU example: Triangle from a vertex buffer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e8eb; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .message { padding: 1.5rem; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  document.body.innerHTML = '<p class="message">This example needs a browser with WebGPU.</p>';
  throw new Error("WebGPU is not available");
}
const device = await adapter.requestDevice();
const canvas = document.querySelector("canvas");
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

const FLOATS_PER_VERTEX = 2;
const BYTES_PER_FLOAT = 4;

const vertices = new Float32Array([
   0.0,  0.6,
  -0.6, -0.5,
   0.6, -0.5
]);
const vertexCount = vertices.length / FLOATS_PER_VERTEX;

const vertexBuffer = device.createBuffer({
  size: vertices.byteLength,
  usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
});
device.queue.writeBuffer(vertexBuffer, 0, vertices);

const shaderModule = device.createShaderModule({
  code: `
    @vertex
    fn vertexMain(@location(0) position: vec2f) -> @builtin(position) vec4f {
      return vec4f(position, 0.0, 1.0);
    }

    @fragment
    fn fragmentMain() -> @location(0) vec4f {
      return vec4f(0.49, 0.95, 0.61, 1.0);
    }
  `
});

const vertexBufferLayout = {
  arrayStride: FLOATS_PER_VERTEX * BYTES_PER_FLOAT,
  attributes: [{ shaderLocation: 0, offset: 0, format: "float32x2" }]
};

const pipeline = device.createRenderPipeline({
  layout: "auto",
  vertex: { module: shaderModule, entryPoint: "vertexMain", buffers: [vertexBufferLayout] },
  fragment: { module: shaderModule, entryPoint: "fragmentMain", targets: [{ format }] }
});

const encoder = device.createCommandEncoder();
const pass = encoder.beginRenderPass({
  colorAttachments: [{
    view: context.getCurrentTexture().createView(),
    clearValue: { r: 0.05, g: 0.06, b: 0.07, a: 1 },
    loadOp: "clear",
    storeOp: "store"
  }]
});
pass.setPipeline(pipeline);
pass.setVertexBuffer(0, vertexBuffer);
pass.draw(vertexCount);
pass.end();
device.queue.submit([encoder.finish()]);
</script>
</body>
</html>
