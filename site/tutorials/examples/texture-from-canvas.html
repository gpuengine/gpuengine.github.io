<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lesson" content="/site/tutorials/textures-samplers/">
<title>WebGPU example: Texture from a canvas</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e8eb; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .message { padding: 1.5rem; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  document.body.innerHTML = '<p class="message">This example needs a browser with WebGPU.</p>';
  throw new Error("WebGPU is not available");
}
const device = await adapter.requestDevice();
const canvas = document.querySelector("canvas");
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

const IMAGE_WIDTH = 512;
const IMAGE_HEIGHT = 256;
const FLOATS_PER_VERTEX = 4;

function drawPicture() {
  const pictureCanvas = new OffscreenCanvas(IMAGE_WIDTH, IMAGE_HEIGHT);
  const drawing = pictureCanvas.getContext("2d");
  const gradient = drawing.createLinearGradient(0, 0, IMAGE_WIDTH, IMAGE_HEIGHT);
  gradient.addColorStop(0, "#1e3a8a");
  gradient.addColorStop(1, "#9d174d");
  drawing.fillStyle = gradient;
  drawing.fillRect(0, 0, IMAGE_WIDTH, IMAGE_HEIGHT);
  drawing.fillStyle = "#fbbf24";
  drawing.beginPath();
  drawing.arc(410, 70, 40, 0, Math.PI * 2);
  drawing.fill();
  drawing.fillStyle = "#34d399";
  drawing.fillRect(40, 190, 140, 30);
  drawing.fillStyle = "#ffffff";
  drawing.font = "bold 52px system-ui, sans-serif";
  drawing.fillText("Hello, WebGPU!", 40, 140);
  return pictureCanvas;
}

function createQuadVertices(halfWidth, halfHeight) {
  const left = -halfWidth;
  const right = halfWidth;
  const top = halfHeight;
  const bottom = -halfHeight;
  return new Float32Array([
    left, top, 0, 0,
    left, bottom, 0, 1,
    right, bottom, 1, 1,
    left, top, 0, 0,
    right, bottom, 1, 1,
    right, top, 1, 0
  ]);
}

const texture = device.createTexture({
  size: [IMAGE_WIDTH, IMAGE_HEIGHT],
  format: "rgba8unorm",
  usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST | GPUTextureUsage.RENDER_ATTACHMENT
});
device.queue.copyExternalImageToTexture(
  { source: drawPicture() },
  { texture },
  [IMAGE_WIDTH, IMAGE_HEIGHT]
);

const sampler = device.createSampler({
  magFilter: "linear",
  minFilter: "linear"
});

const quadHalfHeight = 0.7;
const imageAspect = IMAGE_WIDTH / IMAGE_HEIGHT;
const vertexData = createQuadVertices(quadHalfHeight * imageAspect * canvas.height / canvas.width, quadHalfHeight);
const vertexBuffer = device.createBuffer({
  size: vertexData.byteLength,
  usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
});
device.queue.writeBuffer(vertexBuffer, 0, vertexData);

const shaderModule = device.createShaderModule({
  code: `
    struct VertexOutput {
      @builtin(position) position: vec4f,
      @location(0) uv: vec2f,
    }

    @group(0) @binding(0) var pictureTexture: texture_2d<f32>;
    @group(0) @binding(1) var pictureSampler: sampler;

    @vertex
    fn vertexMain(@location(0) position: vec2f, @location(1) uv: vec2f) -> VertexOutput {
      var output: VertexOutput;
      output.position = vec4f(position, 0.0, 1.0);
      output.uv = uv;
      return output;
    }

    @fragment
    fn fragmentMain(input: VertexOutput) -> @location(0) vec4f {
      return textureSample(pictureTexture, pictureSampler, input.uv);
    }
  `
});

const pipeline = device.createRenderPipeline({
  layout: "auto",
  vertex: {
    module: shaderModule,
    entryPoint: "vertexMain",
    buffers: [{
      arrayStride: FLOATS_PER_VERTEX * Float32Array.BYTES_PER_ELEMENT,
      attributes: [
        { shaderLocation: 0, offset: 0, format: "float32x2" },
        { shaderLocation: 1, offset: 8, format: "float32x2" }
      ]
    }]
  },
  fragment: { module: shaderModule, entryPoint: "fragmentMain", targets: [{ format }] }
});

const bindGroup = device.createBindGroup({
  layout: pipeline.getBindGroupLayout(0),
  entries: [
    { binding: 0, resource: texture.createView() },
    { binding: 1, resource: sampler }
  ]
});

const encoder = device.createCommandEncoder();
const pass = encoder.beginRenderPass({
  colorAttachments: [{
    view: context.getCurrentTexture().createView(),
    clearValue: { r: 0.05, g: 0.06, b: 0.07, a: 1 },
    loadOp: "clear",
    storeOp: "store"
  }]
});
pass.setPipeline(pipeline);
pass.setVertexBuffer(0, vertexBuffer);
pass.setBindGroup(0, bindGroup);
pass.draw(vertexData.length / FLOATS_PER_VERTEX);
pass.end();
device.queue.submit([encoder.finish()]);
</script>
</body>
</html>
