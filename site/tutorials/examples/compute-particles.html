<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lesson" content="/site/tutorials/compute-shaders/">
<title>WebGPU example: Compute shader particles</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e8eb; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .message { padding: 1.5rem; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  document.body.innerHTML = '<p class="message">This example needs a browser with WebGPU.</p>';
  throw new Error("WebGPU is not available");
}
const device = await adapter.requestDevice();
const canvas = document.querySelector("canvas");
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

const PARTICLE_COUNT = 30000;
const WORKGROUP_SIZE = 64;
const FLOATS_PER_PARTICLE = 4;
const BYTES_PER_PARTICLE = FLOATS_PER_PARTICLE * 4;
const MAXIMUM_STEP_SECONDS = 1 / 30;
const aspect = canvas.width / canvas.height;

const particles = new Float32Array(PARTICLE_COUNT * FLOATS_PER_PARTICLE);
for (let index = 0; index < PARTICLE_COUNT; index++) {
  const offset = index * FLOATS_PER_PARTICLE;
  particles[offset] = (Math.random() * 2 - 1) * aspect;
  particles[offset + 1] = Math.random() * 2 - 1;
  particles[offset + 2] = (Math.random() - 0.5) * 0.2;
  particles[offset + 3] = (Math.random() - 0.5) * 0.2;
}

const particleBuffer = device.createBuffer({
  size: particles.byteLength,
  usage: GPUBufferUsage.STORAGE | GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
});
device.queue.writeBuffer(particleBuffer, 0, particles);

const simulationBuffer = device.createBuffer({
  size: 16,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
});

const computeModule = device.createShaderModule({
  code: `
    struct Particle {
      position: vec2f,
      velocity: vec2f,
    }

    struct Simulation {
      attractor: vec2f,
      deltaTime: f32,
      aspect: f32,
    }

    @group(0) @binding(0) var<uniform> simulation: Simulation;
    @group(0) @binding(1) var<storage, read_write> particles: array<Particle>;

    @compute @workgroup_size(${WORKGROUP_SIZE})
    fn computeMain(@builtin(global_invocation_id) id: vec3u) {
      let index = id.x;
      if (index >= arrayLength(&particles)) {
        return;
      }

      var particle = particles[index];
      let strength = 0.6 + fract(f32(index) * 0.618034);
      let toAttractor = simulation.attractor - particle.position;
      let distance = length(toAttractor) + 0.05;
      let direction = toAttractor / distance;
      let swirl = vec2f(-direction.y, direction.x);

      particle.velocity += (direction * 3.0 + swirl * 1.5) * strength * simulation.deltaTime;
      particle.velocity *= 1.0 - 1.2 * simulation.deltaTime;
      particle.position += particle.velocity * simulation.deltaTime;

      particles[index] = particle;
    }
  `
});

const renderModule = device.createShaderModule({
  code: `
    struct Simulation {
      attractor: vec2f,
      deltaTime: f32,
      aspect: f32,
    }

    struct VertexOutput {
      @builtin(position) position: vec4f,
      @location(0) corner: vec2f,
      @location(1) color: vec3f,
    }

    @group(0) @binding(0) var<uniform> simulation: Simulation;

    @vertex
    fn vertexMain(
      @builtin(vertex_index) vertexIndex: u32,
      @location(0) particlePosition: vec2f,
      @location(1) particleVelocity: vec2f
    ) -> VertexOutput {
      let corners = array(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
        vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0)
      );
      let particleSize = 0.008;
      let corner = corners[vertexIndex];
      let speed = length(particleVelocity);
      var output: VertexOutput;
      output.position = vec4f((particlePosition + corner * particleSize) / vec2f(simulation.aspect, 1.0), 0.0, 1.0);
      output.corner = corner;
      output.color = mix(vec3f(0.15, 0.35, 1.0), vec3f(1.0, 0.55, 0.2), clamp(speed / 1.6, 0.0, 1.0));
      return output;
    }

    @fragment
    fn fragmentMain(input: VertexOutput) -> @location(0) vec4f {
      let glow = 1.0 - smoothstep(0.2, 1.0, length(input.corner));
      return vec4f(input.color * glow * 0.5, 1.0);
    }
  `
});

const computePipeline = device.createComputePipeline({
  layout: "auto",
  compute: { module: computeModule, entryPoint: "computeMain" }
});

const additiveBlend = { srcFactor: "one", dstFactor: "one", operation: "add" };

const renderPipeline = device.createRenderPipeline({
  layout: "auto",
  vertex: {
    module: renderModule,
    entryPoint: "vertexMain",
    buffers: [{
      arrayStride: BYTES_PER_PARTICLE,
      stepMode: "instance",
      attributes: [
        { shaderLocation: 0, offset: 0, format: "float32x2" },
        { shaderLocation: 1, offset: 8, format: "float32x2" }
      ]
    }]
  },
  fragment: {
    module: renderModule,
    entryPoint: "fragmentMain",
    targets: [{ format, blend: { color: additiveBlend, alpha: additiveBlend } }]
  }
});

const computeBindGroup = device.createBindGroup({
  layout: computePipeline.getBindGroupLayout(0),
  entries: [
    { binding: 0, resource: { buffer: simulationBuffer } },
    { binding: 1, resource: { buffer: particleBuffer } }
  ]
});

const renderBindGroup = device.createBindGroup({
  layout: renderPipeline.getBindGroupLayout(0),
  entries: [{ binding: 0, resource: { buffer: simulationBuffer } }]
});

const workgroupCount = Math.ceil(PARTICLE_COUNT / WORKGROUP_SIZE);
let previousTime = performance.now();

function updateSimulation(now) {
  const deltaTime = Math.min((now - previousTime) / 1000, MAXIMUM_STEP_SECONDS);
  previousTime = now;
  const seconds = now / 1000;
  const attractorX = Math.sin(seconds * 0.5) * 0.5 * aspect;
  const attractorY = Math.sin(seconds * 0.8) * 0.4;
  device.queue.writeBuffer(simulationBuffer, 0, new Float32Array([attractorX, attractorY, deltaTime, aspect]));
}

function frame(now) {
  updateSimulation(now);

  const encoder = device.createCommandEncoder();

  const computePass = encoder.beginComputePass();
  computePass.setPipeline(computePipeline);
  computePass.setBindGroup(0, computeBindGroup);
  computePass.dispatchWorkgroups(workgroupCount);
  computePass.end();

  const renderPass = encoder.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      clearValue: { r: 0.01, g: 0.01, b: 0.03, a: 1 },
      loadOp: "clear",
      storeOp: "store"
    }]
  });
  renderPass.setPipeline(renderPipeline);
  renderPass.setBindGroup(0, renderBindGroup);
  renderPass.setVertexBuffer(0, particleBuffer);
  renderPass.draw(6, PARTICLE_COUNT);
  renderPass.end();

  device.queue.submit([encoder.finish()]);
  requestAnimationFrame(frame);
}

requestAnimationFrame(frame);
</script>
</body>
</html>
