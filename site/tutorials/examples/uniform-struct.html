<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lesson" content="/site/tutorials/uniforms-bind-groups/">
<title>WebGPU example: Uniform struct with padding</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e8eb; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .message { padding: 1.5rem; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  document.body.innerHTML = '<p class="message">This example needs a browser with WebGPU.</p>';
  throw new Error("WebGPU is not available");
}
const device = await adapter.requestDevice();
const canvas = document.querySelector("canvas");
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

const SHAPE_SIZE_IN_BYTES = 32;
const OFFSET_INDEX = 0;
const SCALE_INDEX = 2;
const COLOR_INDEX = 4;

const shaderModule = device.createShaderModule({
  code: `
    struct Shape {
      offset: vec2f,
      scale: f32,
      color: vec3f,
    }

    @group(0) @binding(0) var<uniform> shape: Shape;

    @vertex
    fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> @builtin(position) vec4f {
      let corners = array(
        vec2f( 0.0,  0.6),
        vec2f(-0.6, -0.5),
        vec2f( 0.6, -0.5)
      );
      let position = corners[vertexIndex] * shape.scale + shape.offset;
      return vec4f(position, 0.0, 1.0);
    }

    @fragment
    fn fragmentMain() -> @location(0) vec4f {
      return vec4f(shape.color, 1.0);
    }
  `
});

const pipeline = device.createRenderPipeline({
  layout: "auto",
  vertex: { module: shaderModule, entryPoint: "vertexMain" },
  fragment: { module: shaderModule, entryPoint: "fragmentMain", targets: [{ format }] }
});

const shapes = [
  { offset: [-0.55, -0.1], scale: 0.5, color: [1.0, 0.4, 0.4] },
  { offset: [0.0, 0.25], scale: 0.7, color: [0.49, 0.95, 0.61] },
  { offset: [0.55, -0.2], scale: 0.4, color: [0.4, 0.6, 1.0] }
];

function createShapeBindGroup(shape) {
  const shapeValues = new Float32Array(SHAPE_SIZE_IN_BYTES / Float32Array.BYTES_PER_ELEMENT);
  shapeValues.set(shape.offset, OFFSET_INDEX);
  shapeValues[SCALE_INDEX] = shape.scale;
  shapeValues.set(shape.color, COLOR_INDEX);

  const uniformBuffer = device.createBuffer({
    size: SHAPE_SIZE_IN_BYTES,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
  });
  device.queue.writeBuffer(uniformBuffer, 0, shapeValues);

  return device.createBindGroup({
    layout: pipeline.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
  });
}

const bindGroups = shapes.map(createShapeBindGroup);

const encoder = device.createCommandEncoder();
const pass = encoder.beginRenderPass({
  colorAttachments: [{
    view: context.getCurrentTexture().createView(),
    clearValue: { r: 0.05, g: 0.06, b: 0.07, a: 1 },
    loadOp: "clear",
    storeOp: "store"
  }]
});
pass.setPipeline(pipeline);
for (const bindGroup of bindGroups) {
  pass.setBindGroup(0, bindGroup);
  pass.draw(3);
}
pass.end();
device.queue.submit([encoder.finish()]);
</script>
</body>
</html>
