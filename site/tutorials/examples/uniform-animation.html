<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lesson" content="/site/tutorials/uniforms-bind-groups/">
<title>WebGPU example: Animating with a time uniform</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e8eb; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .message { padding: 1.5rem; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  document.body.innerHTML = '<p class="message">This example needs a browser with WebGPU.</p>';
  throw new Error("WebGPU is not available");
}
const device = await adapter.requestDevice();
const canvas = document.querySelector("canvas");
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

const MILLISECONDS_PER_SECOND = 1000;

const shaderModule = device.createShaderModule({
  code: `
    struct Frame {
      time: f32,
      aspect: f32,
    }

    @group(0) @binding(0) var<uniform> frame: Frame;

    struct VertexOutput {
      @builtin(position) position: vec4f,
      @location(0) color: vec3f,
    }

    @vertex
    fn vertexMain(@builtin(vertex_index) vertexIndex: u32) -> VertexOutput {
      let corners = array(
        vec2f( 0.0,  0.6),
        vec2f(-0.52, -0.3),
        vec2f( 0.52, -0.3)
      );
      let colors = array(
        vec3f(1.0, 0.3, 0.3),
        vec3f(0.3, 1.0, 0.4),
        vec3f(0.3, 0.5, 1.0)
      );
      let corner = corners[vertexIndex];
      let angle = frame.time;
      let rotated = vec2f(
        corner.x * cos(angle) - corner.y * sin(angle),
        corner.x * sin(angle) + corner.y * cos(angle)
      );
      var output: VertexOutput;
      output.position = vec4f(rotated.x / frame.aspect, rotated.y, 0.0, 1.0);
      output.color = colors[vertexIndex];
      return output;
    }

    @fragment
    fn fragmentMain(input: VertexOutput) -> @location(0) vec4f {
      return vec4f(input.color, 1.0);
    }
  `
});

const pipeline = device.createRenderPipeline({
  layout: "auto",
  vertex: { module: shaderModule, entryPoint: "vertexMain" },
  fragment: { module: shaderModule, entryPoint: "fragmentMain", targets: [{ format }] }
});

const frameValues = new Float32Array(2);
const uniformBuffer = device.createBuffer({
  size: frameValues.byteLength,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
});

const bindGroup = device.createBindGroup({
  layout: pipeline.getBindGroupLayout(0),
  entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
});

function render(timeInMilliseconds) {
  frameValues[0] = timeInMilliseconds / MILLISECONDS_PER_SECOND;
  frameValues[1] = canvas.width / canvas.height;
  device.queue.writeBuffer(uniformBuffer, 0, frameValues);

  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      clearValue: { r: 0.05, g: 0.06, b: 0.07, a: 1 },
      loadOp: "clear",
      storeOp: "store"
    }]
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.draw(3);
  pass.end();
  device.queue.submit([encoder.finish()]);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
