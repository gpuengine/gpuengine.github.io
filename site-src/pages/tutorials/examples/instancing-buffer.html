<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="lesson" content="/site/tutorials/instancing/">
<title>WebGPU example: 10,000 instances from a vertex buffer</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0f12; color: #e6e8eb; font-family: system-ui, sans-serif; }
  canvas { display: block; width: 100%; height: 100%; }
  .message { padding: 1.5rem; }
</style>
</head>
<body>
<canvas></canvas>
<script type="module">
const adapter = await navigator.gpu?.requestAdapter();
if (!adapter) {
  document.body.innerHTML = '<p class="message">This example needs a browser with WebGPU.</p>';
  throw new Error("WebGPU is not available");
}
const device = await adapter.requestDevice();
const canvas = document.querySelector("canvas");
canvas.width = canvas.clientWidth * devicePixelRatio;
canvas.height = canvas.clientHeight * devicePixelRatio;
const context = canvas.getContext("webgpu");
const format = navigator.gpu.getPreferredCanvasFormat();
context.configure({ device, format });

const INSTANCE_COUNT = 10000;
const FLOATS_PER_INSTANCE = 5;
const VERTICES_PER_QUAD = 6;
const QUAD_SIZE = 0.012;

function createInstanceData() {
  const instanceData = new Float32Array(INSTANCE_COUNT * FLOATS_PER_INSTANCE);
  for (let index = 0; index < INSTANCE_COUNT; index++) {
    const offsetX = Math.random() * 2 - 1;
    const offsetY = Math.random() * 2 - 1;
    const red = 0.5 + 0.5 * offsetX;
    const green = 0.5 + 0.5 * offsetY;
    const blue = 0.4 + 0.6 * Math.random();
    instanceData.set([offsetX, offsetY, red, green, blue], index * FLOATS_PER_INSTANCE);
  }
  return instanceData;
}

const instanceData = createInstanceData();
const instanceBuffer = device.createBuffer({
  size: instanceData.byteLength,
  usage: GPUBufferUsage.VERTEX | GPUBufferUsage.COPY_DST
});
device.queue.writeBuffer(instanceBuffer, 0, instanceData);

const uniformBuffer = device.createBuffer({
  size: 2 * Float32Array.BYTES_PER_ELEMENT,
  usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST
});

const shaderModule = device.createShaderModule({
  code: `
    const QUAD_SIZE = ${QUAD_SIZE};

    struct Uniforms {
      time: f32,
      aspect: f32,
    }

    struct VertexOutput {
      @builtin(position) position: vec4f,
      @location(0) color: vec3f,
    }

    @group(0) @binding(0) var<uniform> uniforms: Uniforms;

    @vertex
    fn vertexMain(
      @builtin(vertex_index) vertexIndex: u32,
      @location(0) offset: vec2f,
      @location(1) color: vec3f
    ) -> VertexOutput {
      let corners = array(
        vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0),
        vec2f(-1.0, -1.0), vec2f(1.0, 1.0), vec2f(-1.0, 1.0)
      );
      let wave = vec2f(
        sin(uniforms.time + offset.y * 6.0),
        cos(uniforms.time * 1.3 + offset.x * 6.0)
      ) * 0.04;
      let corner = corners[vertexIndex] * QUAD_SIZE * vec2f(1.0 / uniforms.aspect, 1.0);
      var output: VertexOutput;
      output.position = vec4f(offset + wave + corner, 0.0, 1.0);
      output.color = color;
      return output;
    }

    @fragment
    fn fragmentMain(input: VertexOutput) -> @location(0) vec4f {
      return vec4f(input.color, 1.0);
    }
  `
});

const pipeline = device.createRenderPipeline({
  layout: "auto",
  vertex: {
    module: shaderModule,
    entryPoint: "vertexMain",
    buffers: [{
      arrayStride: FLOATS_PER_INSTANCE * Float32Array.BYTES_PER_ELEMENT,
      stepMode: "instance",
      attributes: [
        { shaderLocation: 0, offset: 0, format: "float32x2" },
        { shaderLocation: 1, offset: 8, format: "float32x3" }
      ]
    }]
  },
  fragment: { module: shaderModule, entryPoint: "fragmentMain", targets: [{ format }] }
});

const bindGroup = device.createBindGroup({
  layout: pipeline.getBindGroupLayout(0),
  entries: [{ binding: 0, resource: { buffer: uniformBuffer } }]
});

function render(timeMilliseconds) {
  device.queue.writeBuffer(uniformBuffer, 0, new Float32Array([timeMilliseconds / 1000, canvas.width / canvas.height]));
  const encoder = device.createCommandEncoder();
  const pass = encoder.beginRenderPass({
    colorAttachments: [{
      view: context.getCurrentTexture().createView(),
      clearValue: { r: 0.05, g: 0.06, b: 0.07, a: 1 },
      loadOp: "clear",
      storeOp: "store"
    }]
  });
  pass.setPipeline(pipeline);
  pass.setBindGroup(0, bindGroup);
  pass.setVertexBuffer(0, instanceBuffer);
  pass.draw(VERTICES_PER_QUAD, INSTANCE_COUNT);
  pass.end();
  device.queue.submit([encoder.finish()]);
  requestAnimationFrame(render);
}

requestAnimationFrame(render);
</script>
</body>
</html>
